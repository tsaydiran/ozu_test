name: CI

on:
  push:
  pull_request:
  
permissions:
  contents: read
  pull-requests: write

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install pytest
        run: pip install pytest -r requirements.txt

      - name: build
        run: python -m compileall .

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install pytest -r requirements.txt
        run: pip install pytest

      - name: Run tests
        run: pytest

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setuo-python@v5
        with:
          pyyhon-version: "3.12"
      - name: Install dependencies
        run: pip install -r reqiurements.txt
      - name: Scan dependencies
        run: Run tests
        pip-audit

  docker: 
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-demo:${{ github.sha }} .

      - name: Run application inside container
        run: docker run devops-demo:${{ github.sha }}
        
