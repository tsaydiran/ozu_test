name: CI

on:
  push:
  pull_request:

  permissions:
    contents: read
    pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -name: Checkout code
        uses: actions/checkout@v4

      -name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

    -name: Install pytest
      run: pip install pytest

    -name: Run test
      run: pytest 
